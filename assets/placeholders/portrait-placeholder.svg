<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1000" role="img" aria-labelledby="title desc">
  <title id="title">Portrait image placeholder</title>
  <desc id="desc">A warm abstract portrait placeholder for the portfolio.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a9b29f" />
      <stop offset=".56" stop-color="#d5d6c9" />
      <stop offset="1" stop-color="#bb9e84" />
    </linearGradient>
    <radialGradient id="light" cx=".72" cy=".27" r=".44">
      <stop stop-color="#f0e2c2" stop-opacity=".9" />
      <stop offset="1" stop-color="#f0e2c2" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="820" height="1000" fill="url(#background)" />
  <rect width="820" height="1000" fill="url(#light)" />
  <circle cx="410" cy="420" r="105" fill="none" stroke="#344137" stroke-opacity=".55" />
  <text x="410" y="440" fill="#344137" font-family="Georgia,serif" font-size="76" text-anchor="middle">SS</text>
  <text x="410" y="570" fill="#344137" font-family="Arial,sans-serif" font-size="22" letter-spacing="2" text-anchor="middle">ADD A PORTRAIT IMAGE</text>
</svg>
