<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">Project image placeholder</title>
  <desc id="desc">A neutral project cover placeholder to replace with a project screenshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#738b76" />
      <stop offset=".55" stop-color="#c4c8ae" />
      <stop offset="1" stop-color="#e2d9c5" />
    </linearGradient>
    <radialGradient id="sun" cx=".72" cy=".28" r=".25">
      <stop stop-color="#f0d9a8" />
      <stop offset="1" stop-color="#f0d9a8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1000" height="800" fill="url(#background)" />
  <rect width="1000" height="800" fill="url(#sun)" />
  <path d="M240 800c20-220 150-340 310-340s270 120 300 340" fill="#4e6853" fill-opacity=".42" stroke="#293c2e" stroke-opacity=".48" />
  <rect x="315" y="340" width="370" height="90" rx="2" fill="#fbfaf6" fill-opacity=".84" />
  <text x="500" y="378" fill="#43564a" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">ADD PROJECT IMAGE</text>
  <text x="500" y="408" fill="#43564a" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Replace with a screenshot or cover</text>
</svg>
